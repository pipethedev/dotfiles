set -g mouse on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable clipboard integration
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Use Arrow keys to move between panes
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R


bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ==========================================
# VS Code style keys
# ==========================================
# Ghostty sends Cmd+<key> as Ctrl+Alt+<key>. These reach Neovim only; in any other
# pane they are dropped, so Cmd+S can never cancel or type into a shell or Claude.
set -s escape-time 0
set -g focus-events on
set -s extended-keys always
set -as terminal-features ",xterm*:extkeys"

bind -n C-M-s if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-s" ""
bind -n C-M-p if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-p" ""
bind -n C-M-b if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-b" ""
bind -n C-M-z if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-z" ""
bind -n C-M-a if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-a" ""
bind -n C-M-c if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-c" ""
bind -n C-M-x if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-x" ""
bind -n C-M-f if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-f" ""
bind -n C-M-d if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-d" ""
bind -n C-M-w if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-w" "confirm-before -p 'Close this pane? (y/n)' kill-pane"
bind -n C-M-g if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-g" ""
bind -n C-M-l if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-l" ""
bind -n C-M-S-p if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-p" ""
bind -n C-M-S-f if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-f" ""
bind -n C-M-S-z if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-z" ""
bind -n C-M-S-k if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-k" ""
bind -n C-M-S-e if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-e" ""
bind -n C-M-S-o if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-o" ""
bind -n C-M-S-m if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-m" ""
bind -n C-M-S-h if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-h" ""
bind -n C-M-S-g if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-g" ""
bind -n C-M-S-v if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-v" ""
bind -n C-M-/ if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-/" ""
bind -n C-M-. if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-." ""
bind -n C-M-Enter if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-Enter" ""
bind -n C-M-S-Enter if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-S-Enter" ""
bind -n C-M-0 if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-0" ""
bind -n C-M-1 if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-1" ""
bind -n C-M-2 if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-2" ""
bind -n C-M-3 if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-3" ""
bind -n C-M-7 if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-7" ""
bind -n C-M-8 if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-8" ""
bind -n C-M-9 if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-9" ""
bind -n 'C-M-\' if -F "#{m:*vim,#{pane_current_command}}" "send-keys 'C-M-\\'" "split-window -h -c '#{pane_current_path}'"

# Cmd+C while selecting with the keyboard in tmux copy mode
bind -T copy-mode-vi C-M-c send-keys -X copy-pipe-and-cancel "pbcopy"

# Cmd+J hides or shows the other panes (like the VS Code panel), Ctrl+` moves to the next pane,
# Cmd+Alt+Arrows move between panes.
bind -n C-M-j if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-j" "resize-pane -Z"
bind -n C-M-t if -F "#{m:*vim,#{pane_current_command}}" "send-keys C-M-t" "select-pane -t :.+"
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R

# Lets Neovim draw images (snacks.nvim) through tmux
set -g allow-passthrough on
